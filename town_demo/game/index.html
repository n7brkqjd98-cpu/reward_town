<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reward Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen">
    <canvas id="world" width="320" height="208"></canvas>
    <div id="labels"></div>
    <div id="hud" class="hidden">
      <div id="hud-clock" class="hud-box"></div>
      <div id="hud-area" class="hud-box"></div>
      <div id="hud-status" class="hud-box"></div>
    </div>
    <div id="panel" class="box hidden"></div>
    <div id="sheet" class="box hidden"></div>
    <div id="dialog" class="box hidden"></div>
    <div id="menu" class="box hidden"></div>
    <div id="toast"></div>
    <div id="flash"></div>
    <div id="title"></div>
  </div>
  <p id="help">Arrows/WASD move · Z/Space/Enter = A · X/Esc = B · Shift run · L talks · J work log · K skills · T speed · P pause</p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
